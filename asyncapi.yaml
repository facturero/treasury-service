asyncapi: 2.6.0
info:
  title: treasury-service — eventos
  version: 1.0.0
  description: >-
    treasury-service PUBLICA estos eventos en el exchange `crm.events` (patrón Outbox, @facturero/outbox-relay) y CONSUME
    dos de facturación, los que abren y cierran partidas de cartera. Todo payload lleva `organizationId` y, añadidos por el
    relay, actor, IP y request-id. Los importes van en centavos de la moneda base de la organización; las fechas de
    emisión y de vencimiento son fechas de calendario `AAAA-MM-DD` sin conversión UTC. Los routing key son de tres
    segmentos `treasury.<recurso>.<acción>` y la acción va en pasado: la bitácora se lee como una lista de hechos.
channels:
  treasury.receivable.opened:
    publish:
      summary: Partida de cartera abierta — un cliente pasa a deber
      description: >-
        Lo publica la factura (`01`), la nota de débito (`05`) o una carga de saldos iniciales. `dueDate` sale de
        `issueDate + los días de crédito` que tenía el cliente EN ESE MOMENTO: cambiar el plazo después no reescribe
        las partidas ya creadas.
      message:
        payload:
          $ref: '#/components/schemas/ReceivablePayload'
  treasury.receivable.cancelled:
    publish:
      summary: Partida anulada — la factura se anuló y contabilidad revirtió su asiento
      description: >-
        El saldo NO queda en cero: lo que se le había acreditado (una nota de crédito) no se revierte con la factura,
        así que la partida queda en contra, que es justo lo que dice el libro mayor.
      message:
        payload:
          allOf:
            - $ref: '#/components/schemas/ReceivablePayload'
            - type: object
              properties:
                reason: { type: string, nullable: true, description: 'El motivo de la anulación, si lo traía el evento' }
  treasury.receivable.credited:
    publish:
      summary: Una nota de crédito redujo la deuda de una partida
      description: >-
        Se emite UN evento por cada importe aplicado, con SU `appliedCents`, no uno con la suma. `advanceId` viene cuando
        lo que se aplicó fue un saldo a favor del cliente: entonces cambian la partida y el anticipo a la vez y la
        bitácora tiene que poder reconstruir las dos caras.
      message:
        payload:
          allOf:
            - $ref: '#/components/schemas/ReceivablePayload'
            - type: object
              properties:
                creditType: { type: string, enum: [credit_note, receipt] }
                creditSourceId: { type: string, format: uuid }
                creditDocumentNumber: { type: string, nullable: true }
                appliedCents: { type: integer, minimum: 1 }
                advanceId: { type: string, format: uuid, nullable: true }
  treasury.customer_advance.opened:
    publish:
      summary: Saldo a favor del cliente abierto (una nota de crédito sin factura a la que aplicarla)
      description: >-
        Ocurre cuando la nota de crédito llega antes que su factura, o cuando la factura ya estaba cubierta. El saldo se
        aplica a la próxima factura del cliente, o a `relatedInvoiceId` si venía indicado.
      message:
        payload:
          $ref: '#/components/schemas/CustomerAdvancePayload'
  treasury.customer_terms.updated:
    publish:
      summary: Condiciones de crédito del cliente cambiadas (plazo o cupo)
      description: >-
        Lleva valor anterior y valor nuevo de AMBOS campos: sin los dos, la bitácora no dice qué cambió.
      message:
        payload:
          $ref: '#/components/schemas/CustomerTermsPayload'
  treasury.opening_balance.loaded:
    publish:
      summary: Carga de saldos iniciales de cartera (qué se cargó, cuánto y por qué)
      message:
        payload:
          $ref: '#/components/schemas/OpeningBalancePayload'

  treasury.receivable.overdue:
    publish:
      summary: Recordatorio de cobro a UN cliente con sus partidas vencidas que tocan hoy
      description: >-
        Lo publica el proceso diario (o «enviar ahora») y SOLO si el Administrador encendió los recordatorios. Un evento
        por cliente (no por partida: 31 facturas vencidas son un correo con la lista). Idempotente por (partida, día) y
        un aviso por partida y semana como máximo. Lo consume `notification-service` (correo al cliente, plantilla
        `treasury.receivable.overdue.html`) y la bitácora. El correo del cliente y el nombre de quien cobra viajan en el
        evento: notificaciones no consulta a nadie.
      message:
        payload:
          $ref: '#/components/schemas/ReceivableOverduePayload'
  treasury.reminder_settings.updated:
    publish:
      summary: La organización cambió cómo se avisa a sus clientes (valor anterior y nuevo)
      message:
        payload:
          $ref: '#/components/schemas/ReminderSettingsPayload'
  treasury.report.exported:
    publish:
      summary: Un reporte salió del sistema como archivo CSV (cartera, antigüedad o estado de cuenta)
      description: >-
        Las lecturas no emiten, pero exportar sí: es la cartera de clientes con sus saldos saliendo del sistema. Lleva el
        reporte, los filtros aplicados (sin claves vacías), el número de filas y quién lo exportó.
      message:
        payload:
          $ref: '#/components/schemas/ReportExportedPayload'

  treasury.payable.opened:
    publish:
      summary: Deuda a un proveedor abierta (factura de compra contabilizada o saldo inicial)
      message:
        payload:
          $ref: '#/components/schemas/PayablePayload'
  treasury.payable.cancelled:
    publish:
      summary: 'Deuda anulada: la factura de compra se anuló (lleva el motivo)'
      message:
        payload:
          $ref: '#/components/schemas/PayablePayload'
  treasury.payable.credited:
    publish:
      summary: Un pago o una retención redujo una deuda (un evento por cada importe aplicado)
      message:
        payload:
          $ref: '#/components/schemas/PayableCreditedPayload'
  treasury.supplier_advance.opened:
    publish:
      summary: 'Anticipo a un proveedor: lo pagado de más, que un pago posterior puede consumir'
      message:
        payload:
          $ref: '#/components/schemas/SupplierAdvancePayload'
  treasury.payable_opening_balance.loaded:
    publish:
      summary: Carga de saldos iniciales de deudas a proveedores (qué, cuánto y por qué)
      message:
        payload:
          $ref: '#/components/schemas/PayableOpeningPayload'
  treasury.payment.created:
    publish:
      summary: Pago a un proveedor creado (borrador)
      message:
        payload:
          $ref: '#/components/schemas/PaymentPayload'
  treasury.payment.updated:
    publish:
      summary: Pago a un proveedor modificado (borrador)
      message:
        payload:
          $ref: '#/components/schemas/PaymentPayload'
  treasury.payment.approved:
    publish:
      summary: Pago aprobado por otra persona que su creador (separación de funciones)
      message:
        payload:
          $ref: '#/components/schemas/PaymentApprovedPayload'
  treasury.payment.posted:
    publish:
      summary: 'Pago contabilizado: es el evento del que contabilidad asienta (Dr proveedores / Cr caja o banco)'
      description: >-
        Lleva TODO lo que la regla del asiento necesita; la fecha del pago es de calendario (`AAAA-MM-DD`, sin hora). Lo consume `accounting-service` (`sourceType: payment`).
      message:
        payload:
          $ref: '#/components/schemas/PaymentPostedPayload'
  treasury.payment.voided:
    publish:
      summary: Pago anulado (lleva el motivo y quién lo contabilizó); contabilidad reversa su asiento
      message:
        payload:
          $ref: '#/components/schemas/PaymentVoidedPayload'
  treasury.payment_settings.updated:
    publish:
      summary: El umbral de aprobación de pagos cambió (valor anterior y nuevo)
      message:
        payload:
          $ref: '#/components/schemas/PaymentSettingsPayload'

  treasury.bank_account.created:
    publish:
      summary: Cuenta bancaria creada
      description: >-
        Lleva los últimos 4 dígitos, NUNCA el número completo, ni el perfil de importación (solo si lo tiene).
      message:
        payload:
          $ref: '#/components/schemas/BankAccountPayload'
  treasury.bank_account.updated:
    publish:
      summary: Cuenta bancaria editada
      description: >-
        `changes` dice qué campos cambiaron, con el valor anterior y el nuevo (un saldo de apertura que se movió, una cuenta desactivada).
      message:
        payload:
          $ref: '#/components/schemas/BankAccountUpdatedPayload'
  treasury.bank_statement.imported:
    publish:
      summary: Extracto bancario importado
      description: >-
        Cuántos renglones entraron, cuántos se omitieron por repetidos o por ser anteriores a la apertura, y el periodo y saldo de cierre.
      message:
        payload:
          $ref: '#/components/schemas/BankStatementImportedPayload'
  treasury.bank_movement.assigned:
    publish:
      summary: Cuenta bancaria asignada a un movimiento
      description: >-
        Cobro o pago anterior a este módulo, o elegido sin cuenta, que pasa a una cuenta; o una cuenta equivocada que se corrige.
      message:
        payload:
          $ref: '#/components/schemas/BankMovementAssignedPayload'
  treasury.bank_movement.reversed:
    publish:
      summary: Movimiento revertido deshaciendo un emparejamiento
      description: >-
        Solo se publica cuando el cobro, pago o ajuste anulado estaba emparejado con un renglón del extracto (el emparejamiento COMPLETO del renglón se deshizo). Lo demás ya lo dice la anulación del documento.
      message:
        payload:
          $ref: '#/components/schemas/BankMovementReversedPayload'
  treasury.bank_adjustment.posted:
    publish:
      summary: Ajuste bancario registrado — contabilidad lo asienta
      description: >-
        Comisión, interés u otro ingreso o egreso del banco. Contabilidad asienta Dr other_expense / Cr bank (`direction: out`) o Dr bank / Cr other_income (`direction: in`) con `amountCents` positivo y `adjustmentDate` como fecha del asiento. Idempotente por `adjustmentId`.
      message:
        payload:
          $ref: '#/components/schemas/BankAdjustmentPayload'
  treasury.bank_adjustment.voided:
    publish:
      summary: Ajuste bancario anulado — contabilidad reversa el asiento
      description: >-
        Lleva el motivo y quién lo anuló. Si llega antes que el posted, contabilidad lo espera.
      message:
        payload:
          $ref: '#/components/schemas/BankAdjustmentVoidedPayload'
  treasury.bank_line.matched:
    publish:
      summary: Renglón del extracto emparejado con movimientos
      description: >-
        `method` dice si lo confirmó una persona a mano o aceptó una sugerencia. La suma de `movements` es exactamente `amountCents`.
      message:
        payload:
          $ref: '#/components/schemas/BankLineMatchedPayload'
  treasury.bank_line.unmatched:
    publish:
      summary: Emparejamiento deshecho
      description: >-
        Los movimientos del renglón quedan libres.
      message:
        payload:
          $ref: '#/components/schemas/BankLineUnmatchedPayload'
  treasury.bank_line.marked_external:
    publish:
      summary: Renglón marcado «ya contabilizado fuera de tesorería»
      description: >-
        Es una afirmación de la persona, no una verificación: lleva el motivo.
      message:
        payload:
          $ref: '#/components/schemas/BankLineExternalPayload'
  treasury.bank_line.unmarked_external:
    publish:
      summary: Marca de «contabilizado fuera de tesorería» quitada
      description: >-
        El renglón vuelve a «sin emparejar».
      message:
        payload:
          $ref: '#/components/schemas/BankLineUnmarkedPayload'
  treasury.bank_reconciliation.closed:
    publish:
      summary: Conciliación bancaria cerrada
      description: >-
        Con diferencia 0. Congela los renglones y emparejamientos hasta la fecha de corte.
      message:
        payload:
          $ref: '#/components/schemas/BankReconciliationPayload'
  treasury.bank_reconciliation.reopened:
    publish:
      summary: Conciliación bancaria reabierta
      description: >-
        Solo la última de la cuenta; lleva el motivo.
      message:
        payload:
          $ref: '#/components/schemas/BankReconciliationReopenedPayload'

  billing.invoice.issued:
    subscribe:
      summary: Factura emitida (publica billing-service; aquí abre partida de cartera)
      description: >-
        Quién lo publica: `billing-service` (canal `billing.invoice.issued` en su asyncapi). Tesorería aplica los
        MISMOS filtros que la contabilización automática de contabilidad (moneda base, forma de pago con rol
        `receivables`, fecha de arranque, cuadre de ventas + IVA = total): si contabilidad no asienta un documento,
        tesorería no abre partida para él. Una venta de POS (`posSaleId`) no abre nada: ya se cobró.
        Ante DUPLICADO: el `UNIQUE (organization_id, source_type, source_id)` devuelve la partida existente y el evento
        se descarta sin escribir nada. Ante DESORDEN: si la nota de crédito llegó antes que su factura, se guarda como
        saldo a favor y se aplica en cuanto llega la factura.
      message:
        payload:
          $ref: '#/components/schemas/InvoiceIssuedPayload'
  billing.invoice.voided:
    subscribe:
      summary: Factura anulada (publica billing-service; aquí se cierra la partida)
      description: >-
        Quién lo publica: `billing-service`. Ante DUPLICADO: si la partida ya está `cancelled` no se toca y no se
        publica nada. Ante DESORDEN (la anulación llega antes que la emisión): se crea una partida `cancelled` de
        importe cero para que la emisión posterior no abra una deuda que ya no existe.
      message:
        payload:
          $ref: '#/components/schemas/InvoiceVoidedPayload'
  treasury.receipt.created:
    publish:
      summary: Cobro guardado en borrador
      description: >-
        No toca saldos ni gasta número: es lo que una persona piensa cobrar. Lleva los importes derivados (aplicado,
        anticipos consumidos y excedente) y las líneas, hasta 20 (el total real va en `lineCount`).
      message:
        payload:
          $ref: '#/components/schemas/ReceiptPayload'
  treasury.receipt.updated:
    publish:
      summary: Borrador de cobro modificado
      description: Solo un borrador se edita; uno contabilizado se anula y se rehace.
      message:
        payload:
          $ref: '#/components/schemas/ReceiptPayload'
  treasury.receipt.posted:
    publish:
      summary: Cobro contabilizado — dinero que entra y deudas que se cubren
      description: >-
        Lo consume contabilidad para asentar: Dr caja o bancos (`accountRole`) por `totalCents`, Dr anticipos de clientes
        por `advanceUsedCents`, Cr cuentas por cobrar (con el cliente como tercero) por `appliedCents` y Cr anticipos de
        clientes por `advanceCents`. La igualdad `totalCents + advanceUsedCents = appliedCents + advanceCents` la fija un
        CHECK en la base. `receiptDate` es una fecha de calendario `AAAA-MM-DD` sin hora: contabilidad NO la convierte por
        UTC. El `number` (`RC-AAAA-NNNNNN`) se asigna al contabilizar. Además se publica `treasury.receivable.credited`
        por cada deuda cubierta (con `creditType: receipt`) y `treasury.customer_advance.opened` si hubo excedente.
      message:
        payload:
          allOf:
            - $ref: '#/components/schemas/ReceiptPayload'
            - type: object
              properties:
                postedBy: { type: string, format: uuid }
  treasury.receipt.voided:
    publish:
      summary: Cobro anulado, con motivo
      description: >-
        Contabilidad reversa el asiento del cobro. Nada se borra: las aplicaciones y los consumos de anticipo se marcan
        anulados, y el anticipo que abrió el excedente se marca anulado. Lleva el MOTIVO y quién lo contabilizó y quién lo
        anuló, que es lo que la bitácora tiene que poder contar.
      message:
        payload:
          allOf:
            - $ref: '#/components/schemas/ReceiptPayload'
            - type: object
              properties:
                reason: { type: string, description: 'Motivo de la anulación (mínimo 5 caracteres)' }
                postedBy: { type: string, format: uuid, nullable: true }
                voidedBy: { type: string, format: uuid }
                voidedAt: { type: string, format: date-time, nullable: true, description: 'Instante de la anulación: contabilidad fecha la reversa con él' }
  purchasing.bill.posted:
    subscribe:
      summary: Factura de compra contabilizada (publica purchasing-service; aquí abre una deuda por pagar)
      description: >-
        Gemela de la regla de contabilidad: la liquidación (docType 03), una moneda distinta de la base, un documento anterior a la fecha de
        arranque, la contabilización automática apagada o una factura que no cuadra subtotal + impuestos = total NO abren deuda (así las cuentas
        por pagar y el libro mayor no divergen). El vencimiento es el de la factura. Idempotente por `UNIQUE (organización, origen, id)`.
      message:
        payload:
          $ref: '#/components/schemas/BillPostedPayload'
  purchasing.bill.voided:
    subscribe:
      summary: Factura de compra anulada (publica purchasing-service; aquí anula su deuda)
      description: >-
        La deuda pasa a `cancelled`; lo ya pagado queda a favor de la empresa. Si la anulación llega ANTES que la factura se guarda una deuda
        «fantasma» ya anulada para que la factura posterior no abra nada.
      message:
        payload:
          $ref: '#/components/schemas/BillPostedPayload'
  fiscal.ec.withholding.issued:
    subscribe:
      summary: Retención autorizada por el SRI (publica fiscal-ecuador; aquí reduce la deuda de la factura que cita)
      description: >-
        NO trae id de factura de compra: se empareja por RUC del proveedor + número del documento sustento. Nunca falla por «no hay deuda»:
        sin RUC/sustento válido o con un sustento que no es factura de compra se IGNORA; con ambos válidos pero sin deuda todavía queda en
        `unmatched_withholdings` y se aplica cuando llegue la factura. Idempotente. No recorta al saldo: contabilidad asienta `Dr payables` por
        el total retenido.
      message:
        payload:
          $ref: '#/components/schemas/WithholdingIssuedPayload'

components:
  schemas:
    BankAccountPayload:
      type: object
      properties:
        organizationId: { type: string, format: uuid }
        bankAccountId: { type: string, format: uuid }
        name: { type: string }
        bankName: { type: string }
        accountType: { type: string, enum: [checking, savings] }
        accountLast4: { type: string, nullable: true }
        currencyCode: { type: string }
        openingBalanceCents: { type: integer, description: 'Con signo (un sobregiro es negativo)' }
        openingDate: { type: string, format: date }
        isActive: { type: boolean }
        hasImportProfile: { type: boolean }
        createdBy: { type: string, format: uuid }
    BankAccountUpdatedPayload:
      allOf:
        - $ref: '#/components/schemas/BankAccountPayload'
        - type: object
          properties:
            changes: { type: object, additionalProperties: { type: object, properties: { from: {}, to: {} } } }
            updatedBy: { type: string, format: uuid }
    BankStatementImportedPayload:
      type: object
      properties:
        organizationId: { type: string, format: uuid }
        statementId: { type: string, format: uuid }
        bankAccountId: { type: string, format: uuid }
        bankAccountName: { type: string }
        fileName: { type: string, nullable: true }
        periodStart: { type: string, format: date }
        periodEnd: { type: string, format: date }
        lineCount: { type: integer }
        skippedDuplicates: { type: integer }
        skippedBeforeOpening: { type: integer }
        closingBalanceCents: { type: integer, nullable: true }
        importedBy: { type: string, format: uuid }
    BankMovementAssignedPayload:
      type: object
      properties:
        organizationId: { type: string, format: uuid }
        movementId: { type: string, format: uuid }
        sourceType: { type: string, enum: [receipt, payment, adjustment] }
        sourceId: { type: string, format: uuid }
        bankAccountId: { type: string, format: uuid }
        previousBankAccountId: { type: string, format: uuid, nullable: true }
        amountCents: { type: integer, description: 'Con signo: + entra, − sale' }
        movementDate: { type: string, format: date }
        assignedBy: { type: string, format: uuid }
    BankMovementReversedPayload:
      type: object
      properties:
        organizationId: { type: string, format: uuid }
        movementId: { type: string, format: uuid }
        sourceType: { type: string, enum: [receipt, payment, adjustment] }
        sourceId: { type: string, format: uuid }
        bankAccountId: { type: string, format: uuid, nullable: true }
        amountCents: { type: integer }
        movementDate: { type: string, format: date }
        unmatched: { type: boolean }
    BankAdjustmentPayload:
      type: object
      description: Lo que contabilidad necesita para asentar. `amountCents` es siempre positivo; el sentido lo da `direction`.
      properties:
        organizationId: { type: string, format: uuid }
        adjustmentId: { type: string, format: uuid }
        bankAccountId: { type: string, format: uuid }
        bankAccountName: { type: string }
        kind: { type: string, enum: [bank_fee, interest, other_in, other_out] }
        direction: { type: string, enum: [in, out] }
        amountCents: { type: integer, minimum: 1 }
        currencyCode: { type: string }
        adjustmentDate: { type: string, format: date, description: 'Fecha de calendario (sin hora) del asiento' }
        description: { type: string }
        reference: { type: string, nullable: true }
        createdBy: { type: string, format: uuid }
    BankAdjustmentVoidedPayload:
      allOf:
        - $ref: '#/components/schemas/BankAdjustmentPayload'
        - type: object
          properties:
            reason: { type: string }
            voidedBy: { type: string, format: uuid }
    BankLineMatchedPayload:
      type: object
      properties:
        organizationId: { type: string, format: uuid }
        lineId: { type: string, format: uuid }
        bankAccountId: { type: string, format: uuid }
        lineDate: { type: string, format: date }
        amountCents: { type: integer }
        method: { type: string, enum: [manual, suggested] }
        movements: { type: array, items: { type: object, properties: { id: { type: string, format: uuid }, sourceType: { type: string }, sourceId: { type: string, format: uuid }, amountCents: { type: integer } } } }
        matchedBy: { type: string, format: uuid }
    BankLineUnmatchedPayload:
      type: object
      properties:
        organizationId: { type: string, format: uuid }
        lineId: { type: string, format: uuid }
        bankAccountId: { type: string, format: uuid }
        lineDate: { type: string, format: date }
        amountCents: { type: integer }
        movementIds: { type: array, items: { type: string, format: uuid } }
        unmatchedBy: { type: string, format: uuid }
    BankLineExternalPayload:
      type: object
      properties:
        organizationId: { type: string, format: uuid }
        lineId: { type: string, format: uuid }
        bankAccountId: { type: string, format: uuid }
        lineDate: { type: string, format: date }
        amountCents: { type: integer }
        reason: { type: string }
        markedBy: { type: string, format: uuid }
    BankLineUnmarkedPayload:
      type: object
      properties:
        organizationId: { type: string, format: uuid }
        lineId: { type: string, format: uuid }
        bankAccountId: { type: string, format: uuid }
        lineDate: { type: string, format: date }
        amountCents: { type: integer }
        unmarkedBy: { type: string, format: uuid }
    BankReconciliationPayload:
      type: object
      properties:
        organizationId: { type: string, format: uuid }
        reconciliationId: { type: string, format: uuid }
        bankAccountId: { type: string, format: uuid }
        bankAccountName: { type: string }
        cutoffDate: { type: string, format: date }
        statementBalanceCents: { type: integer }
        registerBalanceCents: { type: integer }
        pendingCents: { type: integer }
        differenceCents: { type: integer }
        closedBy: { type: string, format: uuid }
    BankReconciliationReopenedPayload:
      allOf:
        - $ref: '#/components/schemas/BankReconciliationPayload'
        - type: object
          properties:
            reason: { type: string }
            reopenedBy: { type: string, format: uuid }
    ReceivablePayload:
      type: object
      properties:
        organizationId: { type: string, format: uuid }
        receivableId: { type: string, format: uuid }
        sourceType: { type: string, enum: [invoice, credit_note, initial_balance] }
        sourceId: { type: string, description: 'Id del comprobante que originó la partida, o `${loadId}:${indice}` en un saldo inicial' }
        invoiceNumber: { type: string, nullable: true, description: Número del comprobante en el SRI }
        customerId: { type: string, format: uuid }
        customerName: { type: string }
        amountCents: { type: integer, minimum: 0 }
        currencyCode: { type: string, example: USD }
        issueDate: { type: string, format: date, description: Fecha de calendario sin conversión UTC }
        dueDate: { type: string, format: date }
    CustomerAdvancePayload:
      type: object
      properties:
        organizationId: { type: string, format: uuid }
        advanceId: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        customerName: { type: string }
        origin: { type: string, enum: [credit_note, receipt] }
        originId: { type: string, format: uuid }
        documentNumber: { type: string, nullable: true }
        amountCents: { type: integer, minimum: 1 }
        currencyCode: { type: string, example: USD }
        relatedInvoiceId: { type: string, format: uuid, nullable: true, description: 'Si no es null, solo se aplica a esa factura' }
    CustomerTermsPayload:
      type: object
      properties:
        organizationId: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        customerName: { type: string }
        previousCreditDays: { type: integer, description: Valor ANTERIOR de días de crédito }
        creditDays: { type: integer, description: Valor NUEVO }
        previousCreditLimitCents: { type: integer, nullable: true, description: Valor ANTERIOR del cupo; null = sin cupo }
        creditLimitCents: { type: integer, nullable: true, description: Valor NUEVO }
        updatedBy: { type: string, format: uuid }
    OpeningBalancePayload:
      type: object
      properties:
        organizationId: { type: string, format: uuid }
        loadId: { type: string, format: uuid }
        cutoffDate: { type: string, format: date }
        customerCount: { type: integer, description: Número de líneas de la carga }
        totalCents: { type: integer, minimum: 0, description: Total cargado en centavos }
        loadedBy: { type: string, format: uuid }
        reason: { type: string }
    ReceivableOverduePayload:
      type: object
      properties:
        organizationId: { type: string, format: uuid }
        organizationName: { type: string, description: 'Con quién se firma el correo' }
        customerId: { type: string, format: uuid }
        customerName: { type: string }
        email: { type: string, description: 'A dónde se envía (solo clientes con correo)' }
        currencyCode: { type: string }
        runDate: { type: string, format: date }
        totalOverdueCents: { type: integer }
        receivableCount: { type: integer, description: 'TODAS las partidas que cubre el aviso' }
        extraItems: { type: integer, description: 'Las que no caben en `items` (máx. 20)' }
        items:
          type: array
          items:
            type: object
            properties:
              receivableId: { type: string, format: uuid }
              documentNumber: { type: string, nullable: true }
              dueDate: { type: string, format: date }
              daysOverdue: { type: integer }
              balanceCents: { type: integer }
        trigger: { type: string, enum: [scheduled, manual] }
        triggeredBy: { type: string, format: uuid, nullable: true }
    ReminderSettingsPayload:
      type: object
      properties:
        organizationId: { type: string, format: uuid }
        enabled: { type: boolean }
        firstAfterDays: { type: integer }
        repeatEveryDays: { type: integer }
        previousEnabled: { type: boolean }
        previousFirstAfterDays: { type: integer }
        previousRepeatEveryDays: { type: integer }
        updatedBy: { type: string, format: uuid, nullable: true }
    ReportExportedPayload:
      type: object
      properties:
        organizationId: { type: string, format: uuid }
        report: { type: string, enum: [receivables, aging, statement] }
        format: { type: string, enum: [csv] }
        filters: { type: object, description: 'Solo los filtros aplicados' }
        rowCount: { type: integer }
        exportedBy: { type: string, format: uuid }
        customerId: { type: string, format: uuid, description: 'Solo en `statement`' }
    PayablePayload:
      type: object
      properties:
        organizationId: { type: string, format: uuid }
        payableId: { type: string, format: uuid }
        sourceType: { type: string, enum: [purchase_bill, initial_balance] }
        sourceId: { type: string }
        documentNumber: { type: string, nullable: true, description: 'Factura del proveedor' }
        internalNumber: { type: string, nullable: true, description: 'FC-AAAA-NNNNNN' }
        supplierId: { type: string, format: uuid }
        supplierName: { type: string }
        supplierIdentification: { type: string, nullable: true }
        amountCents: { type: integer }
        currencyCode: { type: string }
        issueDate: { type: string, format: date }
        dueDate: { type: string, format: date }
        reason: { type: string, nullable: true, description: 'Solo en `cancelled`' }
    PayableCreditedPayload:
      allOf:
        - $ref: '#/components/schemas/PayablePayload'
        - type: object
          properties:
            creditType: { type: string, enum: [payment, withholding] }
            creditSourceId: { type: string }
            creditDocumentNumber: { type: string, nullable: true }
            appliedCents: { type: integer }
    SupplierAdvancePayload:
      type: object
      properties:
        organizationId: { type: string, format: uuid }
        advanceId: { type: string, format: uuid }
        supplierId: { type: string, format: uuid }
        supplierName: { type: string }
        supplierIdentification: { type: string, nullable: true }
        originId: { type: string, format: uuid, description: 'Id del pago que lo originó' }
        documentNumber: { type: string, nullable: true }
        amountCents: { type: integer }
        currencyCode: { type: string }
    PayableOpeningPayload:
      type: object
      properties:
        organizationId: { type: string, format: uuid }
        loadId: { type: string, format: uuid }
        cutoffDate: { type: string, format: date }
        supplierCount: { type: integer, description: Número de líneas de la carga }
        totalCents: { type: integer }
        loadedBy: { type: string, format: uuid }
        reason: { type: string }
    PaymentPayload:
      type: object
      properties:
        organizationId: { type: string, format: uuid }
        paymentId: { type: string, format: uuid }
        number: { type: string, nullable: true, example: PG-2026-000001 }
        status: { type: string, enum: [draft, approved, posted, voided] }
        supplierId: { type: string, format: uuid }
        supplierName: { type: string }
        supplierIdentification: { type: string, nullable: true }
        paymentDate: { type: string, format: date }
        method: { type: string, enum: [cash, transfer, check, other] }
        accountRole: { type: string, enum: [cash, bank] }
        reference: { type: string, nullable: true }
        currencyCode: { type: string }
        totalCents: { type: integer, description: Lo que salió de caja o banco }
        advanceUsedCents: { type: integer, description: Anticipos a proveedores que consume }
        appliedCents: { type: integer, description: Aplicado a facturas }
        advanceCents: { type: integer, description: Excedente que queda como anticipo }
        lineCount: { type: integer }
        lines:
          type: array
          description: Hasta 20; el total real va en `lineCount`
          items: { type: object, properties: { payableId: { type: string, format: uuid }, documentNumber: { type: string, nullable: true }, appliedCents: { type: integer } } }
        advanceUses: { type: array, items: { type: object, properties: { advanceId: { type: string, format: uuid }, usedCents: { type: integer } } } }
    PaymentApprovedPayload:
      allOf:
        - $ref: '#/components/schemas/PaymentPayload'
        - type: object
          properties:
            createdBy: { type: string, format: uuid }
            approvedBy: { type: string, format: uuid }
    PaymentPostedPayload:
      allOf:
        - $ref: '#/components/schemas/PaymentPayload'
        - type: object
          properties:
            createdBy: { type: string, format: uuid }
            approvedBy: { type: string, format: uuid, nullable: true }
            postedBy: { type: string, format: uuid }
    PaymentVoidedPayload:
      allOf:
        - $ref: '#/components/schemas/PaymentPayload'
        - type: object
          properties:
            reason: { type: string }
            postedBy: { type: string, format: uuid, nullable: true }
            voidedBy: { type: string, format: uuid }
            voidedAt: { type: string, format: date-time }
    PaymentSettingsPayload:
      type: object
      properties:
        organizationId: { type: string, format: uuid }
        approvalThresholdCents: { type: integer, nullable: true }
        previousApprovalThresholdCents: { type: integer, nullable: true }
        updatedBy: { type: string, format: uuid, nullable: true }
    BillPostedPayload:
      type: object
      description: Campos que treasury-service lee de `purchasing.bill.posted|voided`; el resto se acepta y se ignora.
      properties:
        organizationId: { type: string, format: uuid }
        billId: { type: string, format: uuid }
        internalNumber: { type: string, nullable: true }
        supplierId: { type: string, format: uuid }
        supplier: { type: object, properties: { identification: { type: string }, legalName: { type: string } } }
        docType: { type: string, example: '01' }
        supplierDocument: { type: string, example: '001-001-000000123' }
        issueDate: { type: string, format: date }
        dueDate: { type: string, format: date }
        currencyCode: { type: string }
        totalCents: { type: integer }
        voidReason: { type: string, nullable: true }
    WithholdingIssuedPayload:
      type: object
      description: Campos que treasury-service lee de `fiscal.ec.withholding.issued`.
      properties:
        organizationId: { type: string, format: uuid }
        withholdingId: { type: string }
        number: { type: string, nullable: true }
        issueDate: { type: string, format: date, nullable: true }
        supplier: { type: object, properties: { identification: { type: string } } }
        support: { type: object, properties: { documentCode: { type: string }, number: { type: string, example: 001-001-000000123 } } }
        totalWithheldCents: { type: integer }
    InvoiceIssuedPayload:
      type: object
      description: Campos que treasury-service lee de `billing.invoice.issued`; el resto se acepta y se ignora.
      properties:
        organizationId: { type: string, format: uuid }
        invoiceId: { type: string, format: uuid }
        customerId: { type: string, format: uuid, nullable: true }
        number: { type: string, nullable: true }
        issueDate: { type: string, description: 'Instante ISO si el emisor lo manda así; la fecha de calendario se deriva con el huso de contabilidad' }
        documentTypeCode: { type: string, description: 'Tipo SRI: 01 factura, 04 nota de crédito, 05 nota de débito', example: '01' }
        relatedInvoiceId: { type: string, format: uuid, nullable: true }
        posSaleId: { type: string, format: uuid, nullable: true, description: 'Si no es null, la venta ya está cobrada y no abre partida' }
        customerSnapshot:
          type: object
          nullable: true
          properties:
            id: { type: string, format: uuid }
            businessName: { type: string }
            identification: { type: string, nullable: true }
        subtotalCents: { type: integer }
        taxTotalCents: { type: integer }
        totalCents: { type: integer, minimum: 1 }
        currencyCode: { type: string, example: USD }
        paymentMethodCode: { type: string, nullable: true }
        lines:
          type: array
          items:
            type: object
            properties:
              subtotalCents: { type: integer }
              taxes:
                type: array
                items:
                  type: object
                  properties:
                    kind: { type: string }
                    amountCents: { type: integer }
    InvoiceVoidedPayload:
      type: object
      properties:
        organizationId: { type: string, format: uuid }
        invoiceId: { type: string, format: uuid }
        number: { type: string, nullable: true }
        issueDate: { type: string, nullable: true }
        reason: { type: string, nullable: true }
        voidedAt: { type: string, nullable: true }
    ReceiptPayload:
      type: object
      required: [organizationId, receiptId, status, customerId, receiptDate, method, accountRole, totalCents, appliedCents]
      properties:
        organizationId: { type: string, format: uuid }
        receiptId: { type: string, format: uuid }
        number: { type: string, nullable: true, description: 'RC-AAAA-NNNNNN; null mientras es borrador' }
        status: { type: string, enum: [draft, posted, voided] }
        customerId: { type: string, format: uuid }
        customerName: { type: string }
        receiptDate: { type: string, description: 'Fecha de calendario AAAA-MM-DD, sin hora' }
        method: { type: string, enum: [cash, transfer, check, card, other] }
        accountRole: { type: string, enum: [cash, bank], description: 'Rol contable que recibe el dinero' }
        reference: { type: string, nullable: true }
        currencyCode: { type: string }
        totalCents: { type: integer, description: 'Lo que entró a caja o banco' }
        advanceUsedCents: { type: integer, description: 'De anticipos anteriores del cliente que este cobro consume' }
        appliedCents: { type: integer, description: 'Lo aplicado a deudas' }
        advanceCents: { type: integer, description: 'Excedente: queda como anticipo nuevo del cliente' }
        lineCount: { type: integer }
        lines:
          type: array
          maxItems: 20
          items:
            type: object
            properties:
              receivableId: { type: string, format: uuid }
              invoiceNumber: { type: string, nullable: true }
              appliedCents: { type: integer }
        advanceUses:
          type: array
          maxItems: 20
          items:
            type: object
            properties:
              advanceId: { type: string, format: uuid }
              usedCents: { type: integer }
